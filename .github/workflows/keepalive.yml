name: Будильник сервера Rionina

# Бесплатный сервер Render засыпает через 15 минут без запросов — будим его каждые 10 минут.
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { sparse-checkout: site/config.json, sparse-checkout-cone-mode: false }
      - run: |
          URL=$(node -p "require('./site/config.json').server || ''")
          if [ -n "$URL" ]; then curl -fsS -m 90 "$URL/api/health" && echo; else echo "Адрес сервера ещё не задан"; fi
