name: Android-приложение Rionina

# Собирает приложение Bedrock для Android и прикладывает его к последнему релизу.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: mobile } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm install
      - run: npm run android
      - run: cd android && ./gradlew assembleDebug
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk ../Rionina-Android.apk
      - name: Приложить к релизу
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          TAG=$(gh release view --json tagName -q .tagName)
          gh release upload "$TAG" ../Rionina-Android.apk --clobber
