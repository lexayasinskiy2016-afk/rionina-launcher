# Сервер Rionina на Render.com — бесплатный тариф.
# Данные хранятся в бесплатной базе Neon (DATABASE_URL), поэтому не пропадают при перезапусках.
services:
  - type: web
    name: rionina
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL     # строка подключения из Neon (postgres://…)
        sync: false
      - key: GEMINI_API_KEY   # необязательно: нейросеть для ИИ-сборок на сервере
        sync: false
